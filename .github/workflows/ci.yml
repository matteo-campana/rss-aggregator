name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/rss-aggregator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/rss-aggregator/go.mod
          cache-dependency-path: backend/rss-aggregator/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -cover

  migrations:
    name: Migrations up/down
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rss_aggregator
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: postgres://postgres:postgres@localhost:5432/rss_aggregator?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/rss-aggregator/go.mod
          cache-dependency-path: backend/rss-aggregator/go.sum

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.21.1

      # Every migration has to be reversible: apply, roll back, apply again.
      - name: Migrate up
        run: goose -dir backend/rss-aggregator/sql/schema postgres "$DB_URL" up

      - name: Migrate down
        run: goose -dir backend/rss-aggregator/sql/schema postgres "$DB_URL" down-to 0

      - name: Migrate up again
        run: goose -dir backend/rss-aggregator/sql/schema postgres "$DB_URL" up

      - name: Show final status
        run: goose -dir backend/rss-aggregator/sql/schema postgres "$DB_URL" status

  integration-tests:
    name: Integration tests (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rss_aggregator_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend/rss-aggregator
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rss_aggregator_test?sslmode=disable
      TEST_REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/rss-aggregator/go.mod
          cache-dependency-path: backend/rss-aggregator/go.sum

      # The suite applies the migrations itself, so it exercises the same schema
      # the application ships with.
      - name: Database
        run: go test ./internal/database/ -count=1 -v

      - name: Redis cache, rate limiting and locking
        run: go test ./internal/cache/ -count=1 -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # There is no Docker daemon in the development sandbox, so this job is
      # what actually proves the Dockerfiles build.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: backend/rss-aggregator
          target: api
          push: false
          load: true
          tags: rss-aggregator-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the migration image
        uses: docker/build-push-action@v6
        with:
          context: backend/rss-aggregator
          target: migrate
          push: false
          load: true
          tags: rss-aggregator-migrate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          load: true
          tags: rss-aggregator-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A built image is not the same as a working one: check the binaries are
      # there and that nothing runs as root.
      - name: Inspect the images
        run: |
          set -eux
          docker run --rm --entrypoint goose rss-aggregator-migrate:ci --version
          docker run --rm --entrypoint sh rss-aggregator-api:ci -c 'test -x /usr/local/bin/api'
          docker run --rm --entrypoint sh rss-aggregator-frontend:ci -c 'test -f /app/server.js'
          for image in rss-aggregator-api rss-aggregator-migrate rss-aggregator-frontend; do
            user=$(docker image inspect "$image:ci" --format '{{.Config.User}}')
            echo "$image runs as '${user}'"
            if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
              echo "$image would run as root" >&2
              exit 1
            fi
          done

      - name: Validate the compose stack
        run: |
          cp .env.example .env
          docker compose config --quiet
