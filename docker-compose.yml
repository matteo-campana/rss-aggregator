name: rss-aggregator

services:
  psql:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - psql_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies the schema, then exits. The API never migrates on startup,
  # where two replicas would race each other.
  migrate:
    build:
      context: ./backend/rss-aggregator
      target: migrate
    environment:
      GOOSE_DBSTRING: postgres://${DB_USERNAME}:${DB_PASSWORD}@psql:5432/${DB_DATABASE}?sslmode=disable
    depends_on:
      psql:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend/rss-aggregator
      target: api
    environment:
      PORT: 8080
      DB_HOST: psql
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # The stack ships both the scraper's database and Redis, so they are on
      # here regardless of what .env says for a bare `make run`.
      SCRAPER_ENABLED: "true"
      SCRAPER_CONCURRENCY: ${SCRAPER_CONCURRENCY:-3}
      SCRAPER_INTERVAL: ${SCRAPER_INTERVAL:-10m}
      REDIS_ENABLED: "true"
      REDIS_ADDR: redis:6379
      REDIS_DB: ${REDIS_DB:-0}
      CACHE_TTL: ${CACHE_TTL:-60s}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-120}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      psql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    environment:
      # Server-side only: the browser never calls the API directly.
      API_BASE_URL: http://api:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  psql_volume:
